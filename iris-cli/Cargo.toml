[package]
name = "iris-cli"
version = "0.1.0"
edition = "2021"
description = "Scriptable command-line client for an Iris vault — a thin wrapper over iris-core::Engine, no logic of its own (ADR-036)"

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
iris-core = { path = "../iris-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
rmcp = { version = "=3.4.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
