[package]
name = "iris-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for Iris — a local-first, git-backed personal knowledge management system"

[dependencies]
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
